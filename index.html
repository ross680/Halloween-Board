<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a0604" />
  <title>3R Shop TV</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="themes.css?v=20261026b" />
</head>
<body>
  <main id="stage" aria-label="3R shop TV">
    <video id="vid" muted playsinline preload="metadata"></video>
    <img id="img" alt="" />
    <div id="fx" aria-hidden="true"></div>
    <div id="card"></div>
    <div id="fade"></div>
    <div id="progress"><span></span></div>
    <div id="counter" aria-live="polite"></div>
    <div id="controls">
      <button id="prev" aria-label="Previous">◀</button>
      <button id="pause" aria-label="Pause">Ⅱ</button>
      <button id="next" aria-label="Next">▶</button>
      <button id="sound" aria-label="Toggle sound">🔇</button>
      <button id="full" aria-label="Fullscreen">⛶</button>
    </div>
  </main>
  <script src="settings.js?v=20261026b"></script>
  <script src="schedule.js?v=20261026c"></script>
  <script src="cards.js?v=20261026b"></script>
  <script src="slides.js?v=205a4df7"></script>
  <script src="app.js?v=20261026b"></script>
</body>
</html>
